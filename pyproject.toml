[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "api-security-lab"
version = "1.0.0"
description = "Isolated API security laboratory with vulnerable and hardened modes"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "httpx>=0.27,<1", "pydantic>=2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
